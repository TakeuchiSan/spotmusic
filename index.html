<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotMp3 Downloader</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        dark: '#050505',
                        glass: 'rgba(255, 255, 255, 0.05)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)',
                        spotGreen: '#1DB954',
                        spotDark: '#121212'
                    },
                    animation: {
                        'blob': 'blob 10s infinite',
                        'fade-in': 'fadeIn 0.8s ease-out forwards',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style type="text/tailwindcss">
        body { @apply bg-dark text-white overflow-x-hidden; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        /* Animasi Equalizer */
        .bar { width: 4px; background: #1DB954; border-radius: 2px; animation: equalize 0.8s infinite alternate; }
        .bar:nth-child(1) { animation-delay: 0.1s; height: 10px; }
        .bar:nth-child(2) { animation-delay: 0.3s; height: 18px; }
        .bar:nth-child(3) { animation-delay: 0.5s; height: 14px; }
        @keyframes equalize { 0% { height: 6px; opacity: 0.5; } 100% { height: 24px; opacity: 1; } }
    </style>
</head>
<body class="relative min-h-screen selection:bg-spotGreen selection:text-black flex flex-col">

    <div class="fixed inset-0 w-full h-full -z-10 pointer-events-none overflow-hidden bg-dark">
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-green-900/20 rounded-full blur-[120px] animate-blob"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-blue-900/10 rounded-full blur-[120px] animate-blob animation-delay-2000"></div>
    </div>

    <div class="container mx-auto px-6 py-8 flex-grow flex flex-col" 
         x-data="{ 
            searchQuery: '', 
            isLoading: false, 
            results: null, 
            hasSearched: false,
            errorMsg: null,
            async performSearch() {
                if (!this.searchQuery.trim()) return;
                this.isLoading = true;
                this.hasSearched = true;
                this.results = null;
                this.errorMsg = null;
                try {
                    const response = await fetch(`/api/search?q=${encodeURIComponent(this.searchQuery)}`);
                    const data = await response.json();
                    if (response.ok && data.status === 'success') {
                        this.results = data.results;
                    } else {
                        this.errorMsg = 'Lagu tidak ditemukan.';
                    }
                } catch (e) {
                    this.errorMsg = 'Gagal terhubung ke API.';
                } finally {
                    this.isLoading = false;
                }
            }
         }">

        <nav class="flex items-center gap-3 mb-12 sm:mb-20 animate-fade-in">
            <div class="relative flex items-center justify-center w-10 h-10 sm:w-12 sm:h-12 bg-gradient-to-br from-spotGreen to-emerald-700 rounded-xl shadow-lg shadow-green-900/40">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                </svg>
            </div>
            
            <div class="flex flex-col">
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white leading-none">
                    Spot<span class="text-transparent bg-clip-text bg-gradient-to-r from-spotGreen to-emerald-400">Mp3</span>
                </h1>
                <span class="text-[10px] font-bold tracking-[0.2em] text-slate-500 uppercase mt-1">Downloader</span>
            </div>
        </nav>

        <div class="w-full max-w-3xl mx-auto transition-all duration-500 ease-out" 
             :class="hasSearched ? 'mb-10' : 'mb-32 mt-10 sm:mt-20'">
            
            <div x-show="!hasSearched" class="text-center mb-10 space-y-3 animate-fade-in" style="animation-delay: 0.1s;">
                <h2 class="text-4xl md:text-5xl font-bold text-white tracking-tight">
                    Dengarkan & <span class="text-spotGreen">Unduh.</span>
                </h2>
                <p class="text-slate-400 text-lg">Cari jutaan lagu favoritmu tanpa batasan.</p>
            </div>

            <div class="relative group z-20 animate-fade-in" style="animation-delay: 0.2s;">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-spotGreen to-blue-500 rounded-2xl blur opacity-20 group-hover:opacity-50 transition duration-500"></div>
                
                <div class="relative flex items-center bg-[#121212] border border-white/10 rounded-2xl p-2 shadow-2xl">
                    <div class="pl-4 pr-3 text-slate-400 group-focus-within:text-spotGreen transition-colors">
                        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    </div>

                    <input 
                        type="text" 
                        x-model="searchQuery" 
                        @keydown.enter.prevent="performSearch()"
                        placeholder="Ketik Judul Lagu atau Artis..." 
                        class="w-full bg-transparent text-white text-lg placeholder-slate-600 border-none focus:ring-0 focus:outline-none py-3"
                    >

                    <button 
                        @click="performSearch()"
                        :disabled="isLoading || !searchQuery"
                        class="ml-2 bg-white text-black hover:bg-spotGreen hover:text-white font-bold px-6 sm:px-8 py-3 rounded-xl transition-all duration-300 disabled:opacity-50 flex items-center gap-2 shadow-lg">
                        <span x-show="!isLoading">Cari</span>
                        <svg x-show="isLoading" class="animate-spin w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    </button>
                </div>
            </div>
        </div>

        <div x-show="errorMsg" class="max-w-xl mx-auto text-center mb-8 animate-fade-in">
            <span class="inline-block bg-red-500/10 text-red-400 border border-red-500/20 px-4 py-2 rounded-lg" x-text="errorMsg"></span>
        </div>

        <div x-show="results && results.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-4 pb-20 relative z-10">
            <template x-for="(song, index) in results" :key="index">
                
                <div class="group relative bg-glass backdrop-blur-md border border-glassBorder rounded-2xl p-3 hover:bg-white/5 hover:border-white/10 transition-all duration-300 animate-fade-in"
                     :style="`animation-delay: ${index * 80}ms`">
                    
                    <div class="flex items-center gap-4">
                        <div class="relative flex-shrink-0 w-20 h-20 sm:w-24 sm:h-24 rounded-lg overflow-hidden bg-black shadow-lg">
                            <img :src="song.thumbnail" class="w-full h-full object-cover opacity-90 group-hover:opacity-100 group-hover:scale-105 transition-all duration-500">
                            
                            <div class="absolute inset-0 flex items-center justify-center gap-[3px] bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                                <div class="bar"></div>
                                <div class="bar"></div>
                                <div class="bar"></div>
                            </div>
                        </div>

                        <div class="flex-grow min-w-0 flex flex-col justify-between h-20 sm:h-24 py-1">
                            <div>
                                <h3 class="text-base sm:text-lg font-bold text-white truncate group-hover:text-spotGreen transition-colors" x-text="song.title"></h3>
                                <p class="text-sm text-slate-400 truncate flex items-center gap-1">
                                    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                                    <span x-text="song.artist"></span>
                                </p>
                            </div>

                            <div class="flex items-center justify-between mt-auto">
                                <span class="text-xs font-mono text-slate-500 border border-white/10 px-1.5 rounded" x-text="song.duration"></span>
                                
                                <a :href="song.download_api" 
                                   class="flex items-center gap-1.5 bg-white text-black hover:bg-spotGreen hover:text-white px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold transition-all duration-300 shadow-lg transform active:scale-95">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                    Unduh
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>

    </div>
</body>
</html>
